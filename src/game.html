<title>Boot Camp Commander</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Header (funds) / tappable base map / scrolling command panel / bottom tab bar.
   Single deliberate dark look: night-watch navy, brass fittings, signal red. */
:root {
  color-scheme: dark;
  --ink: #0a1424;       /* page ground, deep navy */
  --hull: #11203a;      /* panel surface */
  --deck: #1a2e4f;      /* raised card */
  --rail: #2a4470;      /* borders */
  --brass: #e4b84c;     /* accent */
  --brass-ink: #241a03; /* text on brass */
  --signal: #e0503f;    /* warnings */
  --sea: #5fb2d9;       /* info */
  --go: #63c98f;        /* good */
  --text: #e9eff7;
  --muted: #92a5c0;
  --font-display: "Saira Stencil One", "Impact", "Arial Narrow Bold", sans-serif;
  --font-body: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html { height: 100%; box-sizing: border-box; background: var(--ink); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--ink); color: var(--text);
  font-family: var(--font-body); font-size: 15px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; position: relative; }

/* ---------- header ---------- */
.top { padding-block: 10px 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: var(--ink); display: grid; gap: 2px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.basename { font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rank-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 999px; background: var(--deck); border: 1px solid var(--rail); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.rank-chip b { background: var(--brass); color: var(--brass-ink); border-radius: 999px; padding: 1px 6px; font-size: 11px; }
.money-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.money { font-family: var(--font-display); font-size: clamp(30px, 9vw, 42px); line-height: 1.05; color: var(--brass); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.iconbtn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--rail); background: var(--hull); display: grid; place-items: center; font-size: 16px; }
.rates { display: flex; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.rates strong { color: var(--text); font-weight: 600; }
.capbar { margin-top: 6px; position: relative; height: 20px; border-radius: 6px; background: var(--hull); border: 1px solid var(--rail); overflow: hidden; cursor: pointer; }
.capfill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #2b6f8f, var(--sea)); transition: width .3s; }
.capbar.full .capfill { background: repeating-linear-gradient(135deg, #a8392c 0 8px, var(--signal) 8px 16px); }
.captext { position: relative; display: block; text-align: center; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: .03em; text-shadow: 0 1px 2px #0008; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }

/* ---------- base map ---------- */
.stage { flex: 0 0 auto; height: clamp(190px, 34vh, 330px); position: relative; overflow: hidden; border-block: 1px solid var(--rail); background: #24402c; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); pointer-events: none; font-size: 11px; font-weight: 700; letter-spacing: .18em; color: #ffffffcc; background: #0a142499; padding: 3px 10px; border-radius: 999px; transition: opacity .6s; white-space: nowrap; }
.boosts { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.boost { background: var(--brass); color: var(--brass-ink); font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; box-shadow: 0 2px 6px #0007; font-variant-numeric: tabular-nums; }

/* ---------- panel ---------- */
.panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--ink); padding-block: 12px 20px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); overscroll-behavior: contain; }
.tabpane { display: grid; gap: 10px; }
.section-title { font-family: var(--font-display); font-size: 18px; letter-spacing: .04em; color: var(--text); margin: 6px 0 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: -4px 0 0; line-height: 1.35; }

.buymode { display: flex; align-items: center; gap: 6px; }
.buymode span { font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; margin-right: 4px; }
.buymode button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--rail); background: var(--hull); font-weight: 700; font-size: 14px; }
.buymode button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }

.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; background: var(--hull); border: 1px solid var(--rail); border-radius: 12px; }
.row.housing { background: linear-gradient(180deg, #1d3357, var(--hull)); border-color: #3b5d92; }
.row.classified { opacity: .55; }
.ficon { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; font-size: 26px; background: var(--deck); position: relative; }
.ficon .cnt { position: absolute; right: -4px; bottom: -4px; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--brass); color: var(--brass-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.finfo { min-width: 0; display: grid; gap: 1px; }
.fname { font-weight: 700; font-size: 16px; line-height: 1.15; }
.fdesc { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.frate { font-size: 12.5px; color: var(--sea); font-variant-numeric: tabular-nums; }
.buy { min-width: 86px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--brass); background: var(--brass); color: var(--brass-ink); display: grid; gap: 0; text-align: center; line-height: 1.1; font-variant-numeric: tabular-nums; transition: transform .06s; }
.buy:active { transform: scale(.96); }
.buy .q { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.buy .p { font-size: 15px; font-weight: 700; }
.buy:disabled { background: transparent; color: var(--muted); border-color: var(--rail); cursor: default; }
.buy.wide { min-width: 0; width: 100%; padding: 11px; }

.upg .ficon { font-size: 22px; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--rail); border-radius: 12px; font-size: 14px; line-height: 1.4; }

.card { padding: 14px; background: var(--hull); border: 1px solid var(--rail); border-radius: 12px; display: grid; gap: 8px; }
.card h3 { margin: 0; font-family: var(--font-display); font-size: 20px; letter-spacing: .03em; font-weight: 400; }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.big { font-family: var(--font-display); font-size: 28px; color: var(--brass); }
.progress { height: 8px; border-radius: 99px; background: var(--deck); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brass); width: 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--hull); border: 1px solid var(--rail); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.stat .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ach { border-radius: 10px; padding: 8px 10px; border: 1px solid var(--rail); background: var(--hull); min-width: 0; }
.ach.got { border-color: var(--brass); background: linear-gradient(180deg, #3a2f12, var(--hull)); }
.ach .n { font-weight: 700; font-size: 14px; }
.ach .d { font-size: 12px; color: var(--muted); line-height: 1.25; }
.ach:not(.got) .n { color: var(--muted); }

.setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; background: var(--hull); border: 1px solid var(--rail); border-radius: 12px; font-weight: 600; }
.toggle { width: 52px; height: 30px; border-radius: 99px; border: 1px solid var(--rail); background: var(--deck); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: left .15s, background .15s; }
.toggle[aria-checked="true"] { background: #3a2f12; border-color: var(--brass); }
.toggle[aria-checked="true"]::after { left: 25px; background: var(--brass); }
input[type="text"], textarea { width: 100%; background: var(--ink); color: var(--text); border: 1px solid var(--rail); border-radius: 8px; padding: 9px 10px; font: inherit; -webkit-user-select: text; user-select: text; }
textarea { min-height: 80px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--rail); background: var(--deck); font-weight: 700; }
.btn.danger { border-color: var(--signal); color: var(--signal); background: transparent; }
.btn.danger.armed { background: var(--signal); color: #fff; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.credit { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 0 4px; line-height: 1.5; }

/* ---------- tabs ---------- */
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--hull); border-top: 1px solid var(--rail); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { border: 0; background: none; padding: 9px 0 10px; display: grid; justify-items: center; gap: 1px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); position: relative; }
.tabs button .ti { font-size: 19px; line-height: 1.1; filter: grayscale(.7); }
.tabs button[aria-selected="true"] { color: var(--brass); }
.tabs button[aria-selected="true"] .ti { filter: none; }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brass); }
.dot { position: absolute; top: 6px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 2px var(--hull); }

/* ---------- modal / toast ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: #050b16cc; display: grid; place-items: center; padding: 20px max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); }
.modal-card { width: min(420px, 100%); background: var(--hull); border: 1px solid var(--brass); border-radius: 16px; padding: 22px 20px 18px; display: grid; gap: 12px; text-align: center; box-shadow: 0 20px 60px #000a; }
.modal-card .crest { font-size: 44px; line-height: 1; }
.modal-card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--brass); letter-spacing: .03em; text-wrap: balance; }
.modal-card p { margin: 0; color: var(--text); line-height: 1.45; font-size: 15px; }
.modal-card p.m { color: var(--muted); font-size: 14px; }
.toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 60; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 420px; background: var(--deck); border: 1px solid var(--brass); color: var(--text); padding: 9px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: 0 8px 24px #000a; animation: tin .25s ease-out; text-align: center; }
.toast b { color: var(--brass); }
@keyframes tin { from { transform: translateY(-12px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .capfill { transition: none; } }
@media (min-height: 820px) { .stage { height: clamp(220px, 36vh, 360px); } }
</style>

<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="basename" id="baseName">RTC Lakeside</div>
      <div class="rank-chip" id="rankChip"><b>O-1</b><span>Ensign</span></div>
    </div>
    <div class="money-row">
      <div class="money" id="money">$0</div>
      <button class="iconbtn" id="muteBtn" aria-label="Toggle sound" type="button">🔊</button>
    </div>
    <div class="rates">
      <span><strong id="mps">$0</strong>/sec</span>
      <span><strong id="gps">0</strong> grads/sec</span>
      <span><strong id="ppg">$5</strong> per grad</span>
    </div>
    <div class="capbar" id="capBar" role="button" tabindex="0" aria-label="Berthing capacity">
      <div class="capfill" id="capFill"></div>
      <span class="captext" id="capText">Berthing</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="map" aria-label="Your base. Tap to drill recruits."></canvas>
    <div class="boosts" id="boosts"></div>
    <div class="hint" id="hint">TAP THE BASE TO DRILL RECRUITS</div>
  </div>

  <main class="panel" id="panel">
    <section class="tabpane" id="pane-build"></section>
    <section class="tabpane" id="pane-upgrades" hidden></section>
    <section class="tabpane" id="pane-command" hidden></section>
    <section class="tabpane" id="pane-more" hidden></section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="build" aria-selected="true" type="button"><span class="ti">🏗️</span>Build</button>
    <button role="tab" data-tab="upgrades" aria-selected="false" type="button"><span class="ti">⬆️</span>Upgrades<i class="dot" id="upDot" hidden></i></button>
    <button role="tab" data-tab="command" aria-selected="false" type="button"><span class="ti">🎖️</span>Command<i class="dot" id="cmdDot" hidden></i></button>
    <button role="tab" data-tab="more" aria-selected="false" type="button"><span class="ti">⚙️</span>More</button>
  </nav>
</div>

<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div class="toasts" id="toasts"></div>

<script id="core">
/* ===== Pure game logic: no DOM. Shared by the app and the balance simulator. ===== */
var Core = (function () {
  var GROWTH = 1.15;
  var BASE_PAY = 2;

  var FAC = [
    { id: 'drill',   name: 'Drill Hall',                icon: '🥾', base: 15,     rate: 0.1,   color: '#7b8a5a', desc: 'Marching, facing movements, and a great deal of yelling.' },
    { id: 'class',   name: 'Seamanship Classroom',      icon: '📘', base: 100,    rate: 1,     color: '#5a7bb0', desc: 'Knots, rank insignia, and the 11 General Orders.' },
    { id: 'pool',    name: 'Combat Training Pool',      icon: '🏊', base: 1100,   rate: 8,     color: '#2f8fc0', desc: 'Abandon-ship drills. Everyone passes the swim test eventually.' },
    { id: 'chamber', name: 'Confidence Chamber',        icon: '😷', base: 12e3,   rate: 47,    color: '#8a7a9e', desc: 'Mask on, mask off. Tears, sneezes, and character.' },
    { id: 'range',   name: 'Small Arms Range',          icon: '🎯', base: 130e3,  rate: 260,   color: '#9a6b4a', desc: 'Safety brief, sight picture, squeeze. Repeat.' },
    { id: 'fire',    name: 'Firefighting Trainer',      icon: '🧯', base: 1.4e6,  rate: 1400,  color: '#c0553f', desc: 'Hose teams advance on a very real, very hot fire.' },
    { id: 'wet',     name: 'Damage Control Wet Trainer',icon: '🔧', base: 20e6,   rate: 7800,  color: '#3f8f8a', desc: 'Plug the leaks while the compartment floods around you.' },
    { id: 'ship',    name: 'Training Ship Simulator',   icon: '🚢', base: 330e6,  rate: 44e3,  color: '#6f7f99', desc: 'A full-size hull on dry land for mooring and watchstanding.' },
    { id: 'battle',  name: 'Battle Stations Complex',   icon: '⚓', base: 5.1e9,  rate: 260e3, color: '#b08a3c', desc: 'The all-night final test. Recruits walk out as Sailors.' },
    { id: 'academy', name: 'Recruit Command Academy',   icon: '🎓', base: 75e9,   rate: 1.6e6, color: '#9e4f6f', desc: 'Trains the drill instructors who train everyone else.' }
  ];

  var FAC_UP_NAMES = {
    drill:   ['Spit-Shined Boots', 'Cadence Callers', 'Guidon Bearers', 'Precision Drill Team', 'Parade-Ground Perfection'],
    class:   ['Laminated Flashcards', 'Rate Training Manuals', 'Smart Boards', 'Mandatory Study Hall', 'Instructor of the Year'],
    pool:    ['Kickboards', 'Lifeguard Towers', 'Abandon-Ship Platform', 'Wave Machine', 'Olympic Lanes'],
    chamber: ['Fresh Mask Filters', 'Buddy-System Exits', 'Industrial Tissue Supply', 'Calm Breathing Coach', 'Iron Lungs'],
    range:   ['Ear Protection', 'Laser Sights', 'Electronic Targets', 'Marksmanship Ribbons', 'Expert Medal Program'],
    fire:    ['Fresh Hoses', 'Proximity Suits', 'Fog Nozzles', 'Flashover Simulator', 'Fire Captain Mentors'],
    wet:     ['Shoring Lumber', 'Pipe Patch Kits', 'Bigger Leaks', 'Flooding Compartments', 'Damage Control Wizards'],
    ship:    ['Bridge Consoles', 'Mooring Lines', 'VR Watchstanding', 'Full-Scale Hull', 'Commissioned Trainer'],
    battle:  ['Night Ops Lighting', 'Smoke Machines', '12-Hour Scenarios', 'Fog-of-War AI', 'Ball Cap Ceremony'],
    academy: ['Leadership Seminars', 'Honor Graduates', 'Pass-in-Review Field', "Admirals' Lecture Series", 'Hall of Heroes']
  };
  var TIER_AT   = [1, 10, 25, 50, 100, 150, 200, 250, 300];
  var TIER_COST = [10, 50, 500, 5e4, 5e6, 5e8, 5e10, 5e12, 5e14];
  var ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];

  var HOUSING_TIERS = [
    [1, 'Tents'], [3, 'Quonset Huts'], [5, 'Barracks'], [8, 'Recruit Ships'], [12, 'Mega Ships'], [16, 'Berthing Towers'], [21, 'Floating City']
  ];

  var UP = [];
  FAC.forEach(function (f) {
    TIER_AT.forEach(function (at, k) {
      var name = k < 5 ? FAC_UP_NAMES[f.id][k] : f.name.split(' ')[0] + ' Overhaul Mk ' + ROMAN[k - 4];
      UP.push({ id: 'f_' + f.id + '_' + k, kind: 'fac', target: f.id, mult: 2, icon: f.icon, name: name,
        cost: f.base * TIER_COST[k], desc: f.name + ' output ×2', req: { fac: f.id, n: at } });
    });
  });
  [
    ['Federal Training Contract', 5e3], ['Congressional Appropriation', 5e5], ['Defense Budget Line Item', 5e7],
    ['Bipartisan Readiness Act', 5e9], ['Omnibus Spending Bill', 5e11], ['Supplemental Appropriation', 5e13],
    ['Pentagon Priority Funding', 5e15], ['Blank Check from Treasury', 5e17], ['Infinite Budget Memo', 5e19], ['Galactic Defense Fund', 5e21]
  ].forEach(function (c, i) {
    UP.push({ id: 'pay_' + i, kind: 'pay', mult: 1.5, icon: '💵', name: c[0], cost: c[1], desc: 'Government pays +50% per graduate', req: { earned: c[1] * 0.3 } });
  });
  [
    ['Command Voice', 100, 'tap', 2, 'Taps train ×2 recruits', { taps: 15 }],
    ['Smokey Bear Hat', 1500, 'tap', 2, 'Taps train ×2 recruits', { taps: 75 }],
    ['Recruit Division Commander', 2e4, 'tapPct', 0.01, 'Each tap also trains 1% of your per-second rate', { taps: 150 }],
    ['Brass Whistle', 2e6, 'tapPct', 0.01, 'Each tap also trains +1% of your per-second rate', { taps: 300 }],
    ['Megaphone', 2e8, 'tapPct', 0.01, 'Each tap also trains +1% of your per-second rate', { taps: 600 }],
    ['Thousand-Yard Stare', 2e10, 'tapPct', 0.01, 'Each tap also trains +1% of your per-second rate', { taps: 1000 }],
    ['Voice of the Fleet', 2e12, 'tapPct', 0.02, 'Each tap also trains +2% of your per-second rate', { taps: 2000 }]
  ].forEach(function (t, i) {
    UP.push({ id: 'tap_' + i, kind: t[2], mult: t[3], icon: '📣', name: t[0], cost: t[1], desc: t[4], req: t[5] });
  });
  [
    ['Bunk Beds', 1500, 3], ['Triple Racks', 8e4, 6], ['Hot Racking', 5e6, 9], ['Compact Lockers', 4e8, 12],
    ['Modular Berthing', 4e10, 15], ['Vertical Barracks', 4e12, 18], ['Pocket Dimensions', 4e14, 21]
  ].forEach(function (h, i) {
    UP.push({ id: 'house_' + i, kind: 'house', mult: 2, icon: '🛏️', name: h[0], cost: h[1], desc: 'Housing capacity ×2', req: { house: h[2] } });
  });
  [
    ['Mail Clerk', 5e4, 'mailFreq', 'Mail Call shows up 30% more often', 1],
    ['Care Package Program', 5e6, 'mailLen', 'Mail Call bonuses last twice as long', 4],

      var box = $('exportBox'); box.value = exportCode();
      var done = function () { toast('Backup code copied'); };
      try { navigator.clipboard.writeText(box.value).then(done, function () { box.select(); toast('Select the code and copy it'); }); } catch (err) { box.select(); }
      return;
    }
    if (t.id === 'importBtn') {
      try {
        var obj = JSON.parse(decodeURIComponent(escape(atob($('importBox').value.trim()))));
        if (typeof obj.money !== 'number') throw new Error('bad');
        S = hydrate(obj); D = C.derive(S); divisions = []; syncDivisions(); save();
        toast('Backup loaded'); lastSig = { build: '', upgrades: '', command: '' }; renderMore(); refresh(true);
      } catch (err) { toast('That code didn\'t work. Copy the whole backup code and try again.'); }
      return;
    }
    if (t.id === 'resetBtn') {
      if (resetArmed > Date.now()) {
        resetArmed = 0;
        S = C.newState(); S.seenIntro = true; D = C.derive(S); divisions = []; syncDivisions(); save();
        lastSig = { build: '', upgrades: '', command: '' }; toast('Progress erased. Welcome, Ensign.'); setTab('build'); refresh(true);
      } else {
        resetArmed = Date.now() + 4000; t.classList.add('armed'); t.textContent = 'Tap again to erase everything';
        setTimeout(function () { if (t.isConnected) { t.classList.remove('armed'); t.textContent = 'Reset all progress'; } }, 4000);
      }
      return;
    }
  });
  $('panel').addEventListener('input', function (e) {
    if (e.target.id === 'nameInput') { S.baseName = e.target.value.trim() || 'RTC Lakeside'; $('baseName').textContent = S.baseName; }
  });
  $('panel').addEventListener('change', function (e) { if (e.target.id === 'nameInput') save(); });
  $('capBar').addEventListener('click', function () { setTab('build'); });
  $('muteBtn').addEventListener('click', function () { S.settings.sound = !S.settings.sound; syncMute(); save(); if (currentTab === 'more') renderMore(); });
  function syncMute() { $('muteBtn').textContent = S.settings.sound ? '🔊' : '🔇'; }

  function afterBuy() {
    D = C.derive(S); syncDivisions(); sfx.buy(); buzz(false);
    refresh(true);
  }

  /* ---------- header + refresh ---------- */
  var lastRank = -1;
  function renderHeader() {
    $('money').textContent = money(S.money);
    var tp = C.throughput(S, D);
    $('mps').textContent = money(tp * D.pay);
    $('gps').textContent = fmt(tp, true);
    $('ppg').textContent = money(D.pay);
    var full = D.training > D.capacity * 1.0001;
    var pct = D.capacity > 0 ? Math.min(1, D.training / D.capacity) : 0;
    $('capFill').style.width = (pct * 100).toFixed(1) + '%';
    $('capBar').classList.toggle('full', full);
    $('capText').textContent = full
      ? 'Housing full! ' + fmt(D.training, true) + '/s trainees, room for ' + fmt(D.capacity, true) + '/s. Expand housing'
      : 'Housing ' + Math.round(pct * 100) + '% used · room for ' + fmt(D.capacity, true) + ' grads/sec';
    var ri = C.rankIndex(S.allEarned), R = C.RANKS[ri];
    if (ri !== lastRank) {
      $('rankChip').innerHTML = '<b>' + R[2] + '</b><span>' + R[1] + '</span>';
      if (lastRank >= 0 && ri > lastRank) {
        sfx.promo(); buzz(true);
        modal('🎖️', 'Promoted!', '<p>Congress approves your promotion to <b style="color:var(--brass)">' + R[1] + '</b>.</p><p class="m">Your base has earned ' + money(S.allEarned) + ' in career funding.</p>', 'Aye aye');
      }
      lastRank = ri;
    }
    // boosts strip
    var bh = S.boosts.filter(function (b) { return b.until > S.played; }).map(function (b) { return '<span class="boost">' + b.label + ' · ' + Math.ceil(b.until - S.played) + 's</span>'; }).join('');
    if ($('boosts').innerHTML !== bh) $('boosts').innerHTML = bh;
    // tab dots
    $('upDot').hidden = !visibleUps().some(function (u) { return S.money >= u.cost; });
    $('cmdDot').hidden = C.starsPending(S) < 1;
  }
  function renderPane(force) {
    if (currentTab === 'build') renderBuild(force);
    else if (currentTab === 'upgrades') renderUpgrades(force);
    else if (currentTab === 'command') renderCommand(force);
    else if (force) renderMore();
  }
  function refresh(force) { renderHeader(); renderPane(force); }

  /* ---------- main loop ---------- */
  var lastT = 0, uiAcc = 0, achAcc = 0, saveAcc = 0;
  function frame(now) {
    var dt = lastT ? (now - lastT) / 1000 : 0; lastT = now;
    if (dt > 2) { applyAway(dt); dt = 0; }
    dt = Math.min(dt, 0.25);
    C.tick(S, D, dt);
    if (!mail && S.played >= S.nextMail && C.FAC.some(function (f) { return S.fac[f.id]; })) { spawnMail(); S.nextMail = S.played + (70 + Math.random() * 90) * D.mailFreq + 14; }
    drawMap(dt);
    uiAcc += dt; achAcc += dt; saveAcc += dt;
    if (uiAcc > 0.12) { uiAcc = 0; renderHeader(); if (currentTab !== 'more') renderPane(false); }
    if (achAcc > 1) {
      achAcc = 0;
      var fresh = C.checkAch(S);
      if (fresh.length) { D = C.derive(S); fresh.forEach(function (a) { toast('🎗️ Ribbon earned: <b>' + a.name + '</b> (+1% output)'); }); sfx.ach(); }
      syncDivisions();
    }
    if (saveAcc > 5) { saveAcc = 0; save(); }
    requestAnimationFrame(frame);
  }

  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); save(); }
    else if (hiddenAt) { var away = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; lastT = 0; applyAway(away); }
  });
  window.addEventListener('pagehide', save);
  window.addEventListener('resize', function () { layout(); });

  /* ---------- boot ---------- */
  function start(prev) {
    S = (prev && typeof prev.money === 'number') ? hydrate(prev) : (load() || C.newState());
    D = C.derive(S);
    $('baseName').textContent = S.baseName;
    syncMute();
    layout(); syncDivisions();
    if (S.taps >= 8) { hintGone = true; $('hint').style.opacity = '0'; }
    lastRank = C.rankIndex(S.allEarned);
    refresh(true);
    if (!S.seenIntro) {
      modal('⚓', 'Congratulations, Sailor!',
        '<p>You survived boot camp. Now the Navy wants you to <b>run one</b>.</p>' +
        '<p class="m">Tap the base to drill recruits. Build training facilities, keep enough housing for every trainee, and collect a government check for every graduate. Grab the <b>Mail Call</b> envelope when it flies by.</p>',
        'Aye aye, let\'s go', function () { S.seenIntro = true; save(); });
    } else {
      var away = (Date.now() - (S.last || Date.now())) / 1000;
      applyAway(away, 'Welcome back, Commander');
    }
    requestAnimationFrame(frame);
  }

  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { state: S }; }); } catch (e) {} }
  var boot = function (data) { start(data && data.state); };
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
